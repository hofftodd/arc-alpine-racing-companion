      - {slug: ppt-replacement-time, match: [REPLACEMENT_TIME_EET], title: "Clinic Slides: Replacement Time (EET)", roles: [timing]}
      - {slug: ppt-split-second-101, match: [SPLIT_SECOND_101], title: "Clinic Slides: Split Second 101", roles: [timing]}
      - {slug: ppt-parallel, match: [PARALLEL_2026], title: "Clinic Slides: Parallel Events"}
      - {slug: ppt-preparing-tdtr, match: [PREPARING_A_TDTR], title: "Clinic Slides: Preparing a TD Technical Report (TDTR)", roles: [technical-delegate]}
      - {slug: ppt-radio-protocol, match: [RADIO_PROTOCOL], title: "Clinic Slides: Radio Protocol & Techniques", roles: [chief-of-race]}
      - {slug: ppt-minutes-guide, match: [MINUTES_-A_Guide, MINUTES_A_Guide, MINUTESAGuide], title: "Clinic Slides: Minutes, a Guide", roles: [race-admin]}
      - {slug: ppt-vola, match: [VOLA_2026], title: "Clinic Slides: Vola Timing Software", roles: [timing, race-admin]}
      - {slug: ppt-update-review, match: [UPDATE__REVIEW, UPDATE_REVIEW], title: "Clinic Slides: Update & Review (Continuing Education)"}
