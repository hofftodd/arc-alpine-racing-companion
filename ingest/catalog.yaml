      - {slug: ppt-basic-timing, match: [BASIC_T__C, BASIC_T_C, BASICTC], title: "Clinic Slides: Basic Timing & Calculations", roles: [timing]}
      - {slug: ppt-race-administration, match: [RACE_ADMINISTRATION_2026], title: "Clinic Slides: Race Administration", roles: [race-admin]}
