# Identifies each reference document and says how to index it.
#
# build_index.py scans the documents folder (default: ingest/documents/) for
# PDF, PPTX / PPT and Word / Excel files (converted with LibreOffice) and matches each file to an entry below: an entry
# matches when one of its `match` keys appears in the filename (case, spaces
# and punctuation are ignored; the longest matching key wins). Files that match
# nothing are still indexed, using the `unmatched` settings and a title made
# from the filename. The build prints a warning so you can add an entry here.
# Files in a subfolder listed under `folders:` that match no entry take that folder's settings
# instead, with the title from the file name minus a leading packet number ("36 Protest Form").
#
# Fields
#   slug          stable id; also the PDF's name inside the app (slug.pdf)
#   title         shown in citations and the Library
#   collection    Library section
#   jurisdiction  oisra | usss | fis | reference. The race context chosen in a
#                 conversation gives its jurisdiction precedence (see RaceContext.swift)
#   style         outline (default) | rules (3-digit numbered rules) | guide (numbered
#                 rules plus ALL-CAPS narrative chapters, e.g. the Competition Guide) | slides
#   roles         officials the document is written for; answers for that role rank it
#                 higher. Ids: competition-official gate-judge chief-of-course chief-of-race
#                 referee start-finish-referee technical-delegate timing race-admin coach
#   priority      ranking weight when several documents match equally well
#   page_label_pattern  regex with a `label` group, read from each page's first lines
#   ignore_patterns     lines to drop (cover boilerplate)
#   skip_pages    0-based page indexes to leave out
#   rules_from_page  (style guide) 0-based page where the numbered rules begin
#   supplement    Markdown transcription (in the private library, ingest/library/) of tables that PDF text
#                 extraction scrambles; each "## " section becomes a passage citing the PDF
#   see_also      section heading -> ACR rules the section restates without citing them; each of its
#                 passages gets a labeled "(ARC cross-reference: …, see ACR 623.3.3.)" note, so the
#                 rule text is retrieved alongside (check the headings with each new edition)
#   title_in_index  also search each passage under the document title (for blank forms, whose
#                 text rarely names the form)
#   supplement_page  1-based PDF page all supplement passages cite, to reuse another document's
#                 supplement where this document reprints the table (check it with each new edition)

defaults:
  edition: "2026"
  style: outline
  priority: 1.0
  jurisdiction: reference

unmatched:
  collection: Other References
  priority: 0.8
  edition: null

folders:
  # U.S. Ski & Snowboard Alpine Master Packet of Forms (MPF), one file per form. Left out: the
  # cover, the spreadsheet table of contents, the list of named head-tax-exempt athletes, and
  # 14 (Certification Matrix): the newer AO Certification Guidelines file is the same text.
  # "55 Additional FIS Documents" is a PDF portfolio; its three attachments are separate files.
  forms:
    slug_prefix: mpf-
    collection: Race Forms (Master Packet of Forms)
    jurisdiction: usss
    priority: 0.85
    title_in_index: true

groups:
  - name: OISRA
    defaults:
      collection: Oregon High School (OISRA)
      jurisdiction: oisra
      priority: 1.0
    documents:
      - slug: oisra-alpine-race-rules
        match: [OSIRA_ALPINE_RACE_RULES, OISRA_ALPINE_RACE_RULES, OISRA Alpine Race Rules]
        title: OISRA Alpine Race Rules
        edition: "April 2026"
        see_also:
          Re-Runs: ["623.1"]
          Grounds for Interference: ["623.2"]
          # OISRA L.3 says the re-run "remains valid if it proves slower"; ACR 623.3.3 says "even if".
          Validity of a Re-Run: ["623.3.1", "623.3.3"]

  - name: Alpine Officials' Manual
    defaults:
      collection: Alpine Officials' Manual
      jurisdiction: usss
      page_label_pattern: '^(?P<label>(?:[IVX]+|BIB)/\s*\d+|[ivx]+)\s*/\s*\d{4}$'
      ignore_patterns:
        - "^ALPINE OFFICIALS'? MANUAL$"
        - '^SEASON 20\d\d$'
        - '^CHAPTER [IVX]+$'
    documents:
      - {slug: aom-00-cover, match: [Manual_Cover_Contents], title: "Officials' Manual: Contents, Objectives & Code of Conduct", priority: 0.8}
      - {slug: aom-01-introduction, match: [Intro__Overview, Intro_Overview, IntroOverview, "Intro & Overview"], title: "Officials' Manual Ch. I: Introduction and Overview", roles: [competition-official]}
      - {slug: aom-02-superstructure, match: [Superstructure], title: "Officials' Manual Ch. II: The Superstructure of Ski Racing"}
      - {slug: aom-03-rules-jury-td, match: [Rules_Jury, RulesJury, "Rules, Jury"], title: "Officials' Manual Ch. III: Rules, the Jury, and the Technical Delegate", roles: [referee, technical-delegate, chief-of-race]}
      - {slug: aom-04-race-organization, match: [IV._Race_Organization, IVRaceOrganization], title: "Officials' Manual Ch. IV: Race Organization", roles: [referee, technical-delegate, chief-of-race]}
      - {slug: aom-05-secretariat, match: [Secretariat], title: "Officials' Manual Ch. V: The Secretariat", roles: [race-admin]}
      - {slug: aom-06-working-papers, match: [Working_Papers, WorkingPapers], title: "Officials' Manual Ch. VI: Working Papers", roles: [race-admin]}
      - {slug: aom-07-racecourse, match: [The_Racecourse, TheRacecourse], title: "Officials' Manual Ch. VII: The Racecourse", roles: [technical-delegate, chief-of-course]}
      - {slug: aom-08-gate-judges, match: [Gate_Judges, GateJudges], title: "Officials' Manual Ch. VIII: Gate Judges", roles: [referee, start-finish-referee, gate-judge, competition-official]}
      - {slug: aom-09-timing-calculations, match: [IX._Timing, IXTiming], title: "Officials' Manual Ch. IX: Timing and Calculations", roles: [start-finish-referee, timing]}
      - {slug: aom-10-coaches-as-officials, match: [Coaches_as_Officials, CoachesAsOfficials], title: "Officials' Manual Ch. X: Coaches as Officials", roles: [coach]}
      - {slug: aom-11-officials-program, match: [Alpine_Officials_Program, AlpineOfficialsProgram], title: "Officials' Manual Ch. XI: Alpine Officials' Program"}
      - {slug: aom-12-computers, match: [Computers__Ski_Racing, ComputersSkiRacing, Computers_Ski], title: "Officials' Manual Ch. XII: Computers and Ski Racing", roles: [race-admin]}
      - {slug: aom-13-bibliography, match: [BIBLIOGRAPHY], title: "Officials' Manual: Bibliography", priority: 0.5}

  - name: Study Guides
    defaults:
      collection: Officials' Study Guides
      jurisdiction: usss
      priority: 0.95
      ignore_patterns:
        - '^STUDY GUIDE'
        - '^SEASON 20\d\d$'
        - '^U\.S\. SKI & SNOWBOARD$'
    documents:
      - {slug: sg-competition-official, match: [CO_STUDY_GUIDE], title: "Competition Official (Intro to Ski Racing) Study Guide & Quiz", roles: [gate-judge, competition-official]}
      - {slug: sg-chief-of-course, match: [CC_STUDY_GUIDE], title: "Chief of Course Study Guide", roles: [chief-of-course]}
      - {slug: sg-chief-of-race, match: [CR_STUDY_GUIDE], title: "Chief of Race Study Guide", roles: [chief-of-race]}
      - {slug: sg-referee, match: [RF_STUDY_GUIDE], title: "Referee Study Guide", roles: [referee, start-finish-referee, technical-delegate]}
      - {slug: sg-race-admin-1, match: [RA_STUDY_GUIDE_Section_1, RA_STUDY_GUIDE], title: "Race Administration Study Guide, Section 1: Race Result Software", roles: [race-admin]}
      - {slug: sg-race-admin-2, match: [RA_STUDY_GUIDE_Section_2], title: "Race Administration Study Guide, Section 2: Event Administration", roles: [race-admin]}
      - {slug: sg-timing-basic, match: [TC_1_STUDY_GUIDE, TC1_STUDY_GUIDE], title: "Basic Timing & Calculations (TC1) Study Guide", roles: [timing]}
      - {slug: sg-timing-advanced, match: [TC_3_STUDY_GUIDE, TC3_STUDY_GUIDE], title: "Advanced Timing & Calculations (TC3) Study Guide", roles: [timing]}
      - {slug: ao-exam-appeal, match: [Appeal_Failing_AO_Exam], title: "Appeal of an Official's Failing Examination Grade", edition: "2011", priority: 0.8}

  - name: U.S. Ski & Snowboard
    defaults:
      collection: U.S. Ski & Snowboard
      jurisdiction: usss
    documents:
      - slug: usa-alpine-competition-guide
        match: [Alpine_Guide, Alpine Competition Guide, AlpineCompetitionGuide]
        title: "Alpine Competition Guide (incl. ACR)"
        # Chapters 1-6 are narrative with ALL-CAPS headings; chapter 7 is the ACR (numbered rules).
        style: guide
        edition: "2027"
        rules_from_page: 79   # chapter 7, Alpine Competition Regulations
        # The 2027 Course Setting Specifications chart (PDF pages 148-149), transcribed.
        supplement: supplements/usa-alpine-guide-2027-course-setting.md
        priority: 1.1
        roles: [competition-official, gate-judge, chief-of-course, chief-of-race, referee, start-finish-referee, technical-delegate, timing, race-admin, coach]
      - {slug: usa-course-setting-specs, match: [USA_Course_Setting_Specs], title: "U.S. Ski & Snowboard Course Setting Specifications", supplement: supplements/usa-course-setting-specs.md, roles: [technical-delegate, chief-of-course, coach]}
      - {slug: usa-ao-certification-guidelines, match: [AO_Certification_Guidelines], title: "Alpine Officials Certification Guidelines (Certification Matrix)", edition: "2025-26"}
      - {slug: usa-course-length, match: [USA_Course_Length_Recommendations], title: "U.S. Ski & Snowboard Course Length Recommendations", roles: [chief-of-course]}
      - {slug: usa-equipment-regulations, match: [USA_Equipment_Regulations], title: "U.S. Ski & Snowboard Alpine Equipment Regulations", roles: [technical-delegate, coach]}
      - {slug: usa-parallel-non-elimination, match: [Parallel_Non-Elimination, ParallelNonElimination], title: "Non-Elimination Parallel Format", edition: "2025"}
      - {slug: usa-concussion-policy, match: [U.S._Concussion_Policy, USConcussionPolicy], title: "U.S. Ski & Snowboard Concussion Policy for Members", edition: null, roles: [coach]}
      - {slug: safesport-code, match: [Safe_Sport_Code, SafeSportCode], title: "SafeSport Code for the U.S. Olympic and Paralympic Movement", edition: "July 2024", priority: 0.85}
      - {slug: usa-social-media-policy, match: [Social_Media_Policy], title: "Key Volunteers' Social Media Policy", edition: "2018", priority: 0.7}

  - name: FIS
    defaults:
      collection: FIS
      jurisdiction: fis
      edition: null
    documents:
      - slug: fis-icr
        match: [icr-0, icr_0, icr-2, ICR_Book_IV, International_Ski_Competition_Rules, International Ski Competition Rules]
        title: "FIS International Ski Competition Rules (ICR), Book IV: Alpine"
        edition: "2026"
        style: rules
        priority: 1.1
        roles: [competition-official, gate-judge, chief-of-course, chief-of-race, referee, start-finish-referee, technical-delegate, timing, race-admin, coach]
      - {slug: fis-alpine-points, match: [FIS_Rules_for_the_Alpine_Points], title: "FIS Rules for the Alpine Points", edition: "Oct 2025", roles: [timing, race-admin]}
      - {slug: fis-equipment-specs, match: [FIS_Equipment_Specs], title: "FIS Specifications for Alpine Competition Equipment", edition: "2025/26", roles: [technical-delegate, coach]}
      - {slug: fis-timing-booklet, match: [Timing_Booklet, TimingBooklet], title: "FIS Alpine Skiing Timing Booklet", edition: "v2.63, Sept 2024", roles: [timing]}
      - {slug: fis-timing-report-manual, match: [TimingReport_User_Manual, TimingReportUserManual], title: "FIS Timing and Data Technical Report Software: User Manual", edition: "Dec 2024", priority: 0.8, roles: [timing]}
      - {slug: fis-td-memorandum, match: [FIS_TD_Memorandum, TD_Memorandum], title: "FIS Memorandum for the Technical Delegate", edition: "2020", roles: [referee, technical-delegate]}
      - {slug: fis-uni-rules, match: [FIS_UNI_Rules, UNI_Rules], title: "Rules for FIS-UNI Competitions", edition: "2023", priority: 0.8}
      - {slug: fis-homologated-flex-poles, match: [Homol._Flex_Poles, Flex_Poles], title: "FIS Homologated Flex Poles", edition: "Oct 2021", priority: 0.9, roles: [chief-of-course]}
      - {slug: fis-homologated-gate-panels, match: [Homol._Gate_Panels, Gate_Panels], title: "FIS Homologated Gate Panels", edition: "Dec 2024", priority: 0.9, roles: [chief-of-course]}
      - {slug: fis-safety-material, match: [Safety_Material], title: "FIS Safety Material Suppliers", edition: "Sept 2024", priority: 0.6, roles: [chief-of-course]}

  - name: Medical & Safety
    defaults:
      collection: Medical & Safety
      jurisdiction: reference
      edition: null
      priority: 0.85
    documents:
      - {slug: fis-medical-guide, match: [FIS_Medical_Guide], title: "FIS Medical Guide", edition: "2020", jurisdiction: fis}
      - {slug: fis-competitions-and-cold, match: [Competitions_and_Cold], title: "FIS Medical Committee: Competitions & Cold", jurisdiction: fis}
      - {slug: fis-sport-low-temperatures, match: [Sport_at_Low_Temperatures], title: "FIS Medical Committee: Sport at Low Temperatures", jurisdiction: fis}
      - {slug: concussion-recognition-tool-6, match: [Concussion_Recognition_Tool], title: "Concussion Recognition Tool 6 (CRT6)", edition: "2023"}
      - {slug: scat6, match: [SCAT6], title: "Sport Concussion Assessment Tool 6 (SCAT6)", edition: "2023"}
      - {slug: cdc-concussion-officials, match: [Concussion_Fact_Sheet_for_Officials], title: "CDC HEADS UP: Concussion Fact Sheet for Officials"}
      - {slug: cdc-concussion-coaches, match: [Concussion_Fact_Sheet_for_Coaches], title: "CDC HEADS UP: Concussion Fact Sheet for Coaches"}
      - {slug: cdc-concussion-parents, match: [Concussion_Fact_Sheet_for_Parents], title: "CDC HEADS UP: Concussion Fact Sheet for Parents"}
      - {slug: cdc-concussion-athletes, match: [Concussion_Fact_Sheet_Athletes], title: "CDC HEADS UP: Concussion Fact Sheet for Athletes"}
      - {slug: cdc-concussion-young-athletes, match: [Concussion_Fact_Sheet_Young_Athletes], title: "CDC HEADS UP: Concussion Fact Sheet for Young Athletes"}
      - {slug: cdc-concussion-wallet-card, match: [Concussion_Wallet_Card], title: "CDC HEADS UP: Coaches' Concussion Wallet Card", priority: 0.7}
      - {slug: cdc-concussion-clipboard, match: [Heads_Up_Concussion_Clipboard], title: "CDC HEADS UP: Concussion Clipboard Sticker", priority: 0.7}

  - name: Race Forms
    # Master Packet forms that need more than the `forms` folder defaults: FIS-only forms (so
    # unchecking FIS hides them) and files whose names make poor titles. Keys include the packet
    # number, because "FIS Event Document Packets" is also part of "Non-FIS Event Document Packets".
    defaults:
      collection: Race Forms (Master Packet of Forms)
      jurisdiction: fis
      priority: 0.85
      title_in_index: true
    documents:
      - {slug: mpf-fis-event-document-packets, match: [06 FIS Event Document Packets], title: "FIS Event Document Packets"}
      - {slug: mpf-common-errors-fis-documentation, match: [07 Common Errors in FIS Race Documentation], title: "Common Errors in FIS Race Documentation"}
      - {slug: mpf-distribution-of-documents-fis, match: [08 Distribution of Documents - FIS Events], title: "Distribution of Documents: FIS Events"}
      - {slug: mpf-fis-entry-form, match: [13 FIS Entry Form], title: "FIS Entry Form"}
      - {slug: mpf-fis-athlete-declaration, match: [17 FIS Athlete Declaration], title: "FIS Athlete Declaration"}
      - {slug: mpf-checklist-for-tc-meeting, match: [24 Checklist for TC Meeting], title: "Checklist for the Team Captains' Meeting (FIS)"}
      - {slug: mpf-program-tc-minutes-fis, match: [27 Program & TC Minutes - FIS], title: "Program & Team Captains' Meeting Minutes: FIS"}
      - {slug: mpf-program-tc-minutes-fis-parallel, match: [28 Program & TC Minutes - FIS Parallel], title: "Program & Team Captains' Meeting Minutes: FIS Parallel"}
      - {slug: mpf-fis-penalty-calculation, match: [40 FIS Penalty Calculation], title: "FIS Penalty Calculation"}
      - {slug: mpf-fis-additional-td-report, match: [46 FIS Additional Rpt TD], title: "FIS Additional Report of the TD"}
      - {slug: mpf-usa-fis-td-expense-report, match: [48 USA FIS TD Expense Report], title: "U.S. FIS TD Expense Report"}
      - {slug: mpf-fis-special-circumstances, match: [55 Additional FIS Documents - Special Circumstances], title: "Additional FIS Documents: Special Circumstances"}
      - {slug: mpf-fis-injury-report-form, match: [55a FIS Injury Report Form], title: "FIS Injury Report Form"}
      - {slug: mpf-fis-td-report, match: [55b FIS TD Report], title: "FIS TD Report"}
      - {slug: mpf-fis-td-expense-report-canada, match: [FIS-TD-XP-Form-CAN-races], title: "FIS TD Expense Report (Canadian Races)"}
      - {slug: mpf-us-td-report, match: [41 U.S TD Report Fill In], title: "U.S. Technical Delegate Report", jurisdiction: usss}
      - {slug: mpf-us-additional-td-report, match: [45 U.S. Additional Rpt TD], title: "U.S. Additional Report of the TD", jurisdiction: usss}
      - {slug: mpf-non-fis-team-entry-form, match: [12 Non-FIS. Team Entry Form], title: "Non-FIS Team Entry Form", jurisdiction: usss}
      - {slug: mpf-equipment-control-protest-guidelines, match: [16 Guidelines Equipment Control  Protest], title: "Guidelines for Equipment Control and Equipment Protests", jurisdiction: usss}
      - {slug: mpf-eet-worksheet, match: [33 Replacement Time (EET) Worksheet], title: "Replacement Time (EET) Worksheet", jurisdiction: usss}
      - {slug: mpf-eet-worksheet-example, match: [34 Replacement Time (EET) Worksheet & Example], title: "Replacement Time (EET) Worksheet & Example", jurisdiction: usss}

  - name: Clinic Presentations
    defaults:
      collection: Clinic Presentations
      jurisdiction: usss
      style: slides
      priority: 0.75
    documents:
      - {slug: ppt-intro-ski-racing, match: [INTRO_SKI_RACING_CO], title: "Clinic Slides: Introduction to Ski Racing (Competition Official)", roles: [gate-judge, competition-official]}
      - {slug: ppt-chief-of-course, match: [CHIEF_OF_COURSE_2026], title: "Clinic Slides: Chief of Course", roles: [chief-of-course]}
      - {slug: ppt-chief-of-race, match: [CHIEF_OF_RACE_2026], title: "Clinic Slides: Chief of Race", roles: [chief-of-race]}
