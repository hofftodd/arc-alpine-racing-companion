# Generate the Xcode project with: xcodegen generate
name: AlpineRacingCompanion
options:
  bundleIdPrefix: com.hoffmannet
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"  # scripts/bump_build.sh before each TestFlight upload
configFiles:
  # DEVELOPMENT_TEAM comes from App/Config/Local.xcconfig (git-ignored); see DISTRIBUTION.md.
  Debug: App/Config/Signing.xcconfig
  Release: App/Config/Signing.xcconfig
packages:
  RulebookKit:
    path: Packages/RulebookKit
targets:
  AlpineRacingCompanion:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources/rulebook.sqlite
        buildPhase: resources
        optional: true  # built by scripts/build_resources.sh
      # Folder reference keeps PDFs under Documents/ in the bundle.
      - path: App/Resources/Documents
        type: folder
        buildPhase: resources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RulebookKit
        product: RulebookKit
      - package: RulebookKit
        product: RulebookMLX
    info:
      path: App/Config/Info.plist
      properties:
        CFBundleDisplayName: ARC
        # Only standard HTTPS (the one-time model download): exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.reference
        # Dictating questions in the ask box; recognition runs on the device only.
        NSMicrophoneUsageDescription: ARC listens while you dictate a question. Audio stays on this device.
        NSSpeechRecognitionUsageDescription: ARC turns your spoken question into text, on this device.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~iphone:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoffmannet.alpineracingcompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # iOS: increased memory limit, needed to run Qwen3 4B on iPhone/iPad.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/Config/iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Config/iOS.entitlements
        # macOS: sandbox with outbound network for the one-time model download, the microphone for dictation, and printing.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Config/macOS.entitlements
schemes:
  AlpineRacingCompanion:
    build:
      targets:
        AlpineRacingCompanion: all
    run:
      config: Debug
